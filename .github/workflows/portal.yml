name: Portal CI

on:
  push:
    paths:
      - "portal-api/**"
      - "portal-web/**"
      - "pom.xml"
      - ".github/workflows/portal.yml"
  pull_request:
    paths:
      - "portal-api/**"
      - "portal-web/**"
      - "pom.xml"

jobs:
  portal-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Install nfse lib
        run: mvn -q install -DskipTests
      - name: Build and test portal-api
        run: mvn -q -f portal-api/pom.xml package

  portal-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: portal-web/package-lock.json
      - name: Install & build
        working-directory: portal-web
        run: |
          npm ci
          npm run lint
          npm run build
